services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ifter
      POSTGRES_PASSWORD: ifter
      POSTGRES_DB: ifter
    ports:
      # Host 5433 supaya tidak bentrok dengan PostgreSQL lokal/proyek lain di 5432.
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifter -d ifter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
