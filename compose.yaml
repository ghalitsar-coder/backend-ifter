services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ifter
      POSTGRES_PASSWORD: ifter
      POSTGRES_DB: ifter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifter -d ifter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
