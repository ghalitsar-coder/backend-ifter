services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://app:app@postgres:5432/app?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_APP_ENV: production
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: "8080"
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      APP_DB_USER: app
      APP_DB_PASSWORD: app
      APP_DB_NAME: app
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-change-me-to-at-least-32-characters-long}
      APP_LOG_FORMAT: json
    ports:
      - "8080:8080"

volumes:
  pgdata:
