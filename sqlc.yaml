version: "2"

sql:
  - engine: "postgresql"
    # Keep this list in sync with the up migrations.
    schema:
      - "db/migrations/000001_extensions.up.sql"
      - "db/migrations/000002_identity.up.sql"
      - "db/migrations/000003_master_data.up.sql"
      - "db/migrations/000004_imports.up.sql"
      - "db/migrations/000005_attendance.up.sql"
      - "db/migrations/000006_discipline.up.sql"
      - "db/migrations/000009_teacher_presence.up.sql"
      - "db/migrations/000010_dispensations.up.sql"
      - "db/migrations/000011_duty_rotation.up.sql"
      - "db/migrations/000012_sanction_rules.up.sql"
      - "db/migrations/000013_employment_type.up.sql"
      - "db/migrations/000014_correction_evidence.up.sql"
      - "db/migrations/000015_student_accounts.up.sql"
      - "db/migrations/000016_student_notes.up.sql"
      - "db/migrations/000017_devices.up.sql"
      - "db/migrations/000018_push_subscriptions.up.sql"
    queries:
      - "db/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
